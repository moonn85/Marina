  <!-- Cache Version Control - Xóa cache khi có version mới -->
  <script>
    (function () {
      // ⚠️ QUAN TRỌNG: Tăng version này mỗi khi deploy version mới
      const APP_VERSION = '1.0.1';
      const VERSION_KEY = 'app_cache_version';
      const CACHE_TIMESTAMP_KEY = 'app_cache_timestamp';

      const storedVersion = localStorage.getItem(VERSION_KEY);
      const storedTimestamp = localStorage.getItem(CACHE_TIMESTAMP_KEY);

      // Kiểm tra nếu có version mới hoặc cache quá cũ (> 7 ngày)
      const shouldClearCache =
        (storedVersion && storedVersion !== APP_VERSION) ||
        (storedTimestamp && Date.now() - parseInt(storedTimestamp) > 7 * 24 * 60 * 60 * 1000);

      if (shouldClearCache || !storedVersion) {
        // Xóa Service Worker cache
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }

        // Xóa Cache API
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              caches.delete(name);
            });
          });
        }

        // Xóa localStorage cũ (giữ lại một số keys quan trọng nếu cần)
        const importantKeys = ['app_cache_version', 'app_cache_timestamp', 'hasSelectedLanguage'];
        const keysToKeep = {};
        importantKeys.forEach(function (key) {
          const value = localStorage.getItem(key);
          if (value) keysToKeep[key] = value;
        });
        localStorage.clear();
        Object.keys(keysToKeep).forEach(function (key) {
          if (key !== VERSION_KEY && key !== CACHE_TIMESTAMP_KEY) {
            localStorage.setItem(key, keysToKeep[key]);
          }
        });

        // Lưu version và timestamp mới
        localStorage.setItem(VERSION_KEY, APP_VERSION);
        localStorage.setItem(CACHE_TIMESTAMP_KEY, Date.now().toString());

        // Nếu có version mới, force reload
        if (storedVersion && storedVersion !== APP_VERSION) {
          // Thêm timestamp vào URL để bypass browser cache
          const url = new URL(window.location.href);
          url.searchParams.set('_v', APP_VERSION);
          url.searchParams.set('_t', Date.now());
          window.location.replace(url.toString());
          return;
        }
      } else {
        // Cập nhật timestamp
        localStorage.setItem(CACHE_TIMESTAMP_KEY, Date.now().toString());
      }
    })();
  </script>

  <!-- Script helper: cập nhật canonical khi SPA thay đổi route (supports history.pushState) -->
  <script>
    (function () {
      var SITE_ORIGIN = 'https://anstay.com.vn';

      function updateCanonical() {
        try {
          var link = document.getElementById('canonicalLink');
          var path = location.pathname.replace(/\/+$/, '') || '/';
          link.setAttribute('href', SITE_ORIGIN + path);
          // cập nhật og:url
          var og = document.querySelector('meta[property="og:url"]');
          if (og) og.setAttribute('content', SITE_ORIGIN + path);
        } catch (e) { }
      }

      // intercept pushState / replaceState
      (function (history) {
        var push = history.pushState;
        history.pushState = function () {
          var ret = push.apply(this, arguments);
          setTimeout(updateCanonical, 0);
          return ret;
        };
        var replace = history.replaceState;
        history.replaceState = function () {
          var ret = replace.apply(this, arguments);
          setTimeout(updateCanonical, 0);
          return ret;
        };
      })(window.history);

      window.addEventListener('popstate', updateCanonical);
      // initial
      updateCanonical();

    })();
  </script>

  <!-- Script để defer CSS loading và không chặn render -->
  <script>
    // Defer CSS loading để không chặn render - chạy ngay lập tức
    (function () {
      // Function để defer CSS
      function deferCSS(link) {
        if (link.rel === 'stylesheet' && link.href) {
          var href = link.href;
          var isLocalCSS = href.indexOf(window.location.origin) === 0 ||
            href.indexOf('/css/') !== -1 ||
            (href.indexOf('http') !== 0 && href.indexOf('/') === 0);

          if (isLocalCSS && !link.getAttribute('data-deferred')) {
            link.setAttribute('data-deferred', 'true');
            // Sử dụng media="print" trick để không chặn render
            link.media = 'print';
            link.onload = function () {
              this.media = 'all';
            };
            // Fallback cho browsers không hỗ trợ onload
            if (!('onload' in link)) {
              setTimeout(function () {
                link.media = 'all';
              }, 0);
            }
          }
        }
      }

      // Defer CSS links đã có sẵn
      var existingLinks = document.querySelectorAll('link[rel="stylesheet"]');
      existingLinks.forEach(deferCSS);

      // Intercept CSS links mới được thêm vào
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node.nodeName === 'LINK') {
              deferCSS(node);
            }
          });
        });
      });

      // Bắt đầu observe ngay lập tức
      if (document.head) {
        observer.observe(document.head, { childList: true, subtree: true });
      } else {
        var checkHead = setInterval(function () {
          if (document.head) {
            clearInterval(checkHead);
            observer.observe(document.head, { childList: true, subtree: true });
          }
        }, 10);
      }
    })();
  </script>
